<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>i use arch btw</title>
  <link rel="icon" href="https://archlinux.org/static/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/effects.css">
</head>
<body data-theme="tokyo-night" data-scanlines="on" data-crt="on" data-matrix="off">

  <canvas id="matrix-canvas" aria-hidden="true"></canvas>

  <div id="terminal-window">

    <!-- ── Titlebar ───────────────────────────────────── -->
    <div id="titlebar">
      <div class="titlebar-dots">
        <div class="dot dot-red"    title="close"></div>
        <div class="dot dot-yellow" title="minimize"></div>
        <div class="dot dot-green"  title="maximize"></div>
      </div>

      <span id="titlebar-title">user@archlinux: ~</span>

      <div id="titlebar-controls">
        <button class="ctrl-btn" id="btn-theme"     title="cycle colour scheme">tokyo-night</button>
        <button class="ctrl-btn" id="btn-scanlines" title="toggle scanlines">lines</button>
        <button class="ctrl-btn" id="btn-crt"       title="toggle CRT flicker">crt</button>
        <button class="ctrl-btn" id="btn-matrix"    title="toggle matrix rain">matrix</button>
        <button class="ctrl-btn" id="btn-share"     title="copy neofetch to clipboard">share</button>
      </div>
    </div>

    <!-- ── Terminal body ──────────────────────────────── -->
    <div id="terminal-body">
      <div id="terminal-output"></div>

      <!-- Prompt line -->
      <div id="prompt-line">
        <span class="prompt-bracket">[</span><span class="prompt-user">user</span><span class="prompt-at">@</span><span class="prompt-host">archlinux</span><span class="prompt-space"> </span><span class="prompt-path">~</span><span class="prompt-bracket">]</span><span class="prompt-sym">$</span>&nbsp;<span id="prompt-display"></span><span id="cursor"></span>
      </div>

      <!-- Hidden keyboard capture — must NOT be display:none (iOS) -->
      <input
        id="terminal-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        tabindex="0"
        aria-label="terminal input"
      >
    </div>

    <!-- Mobile history navigation (shown on touch devices via CSS) -->
    <div id="mobile-history">
      <button id="mobile-up"   aria-label="previous command">▲ prev</button>
      <button id="mobile-down" aria-label="next command">▼ next</button>
    </div>

    <!-- Vim mode indicator -->
    <div id="vim-indicator">-- INSERT --  (:q to quit)</div>

  </div>

  <!-- Clipboard toast -->
  <div id="share-toast" role="status" aria-live="polite">neofetch copied!</div>

  <!-- Scripts: load order matters — effects/themes/commands before terminal/main -->
  <script src="js/effects.js"  defer></script>
  <script src="js/themes.js"   defer></script>
  <script src="js/commands.js" defer></script>
  <script src="js/terminal.js" defer></script>
  <script src="js/main.js"     defer></script>
</body>
</html>
